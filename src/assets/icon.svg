<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- 卡通扁平化：天蓝底 + 螺旋线圈便签本 + 黄色铅笔 -->
  <rect width="128" height="128" rx="28" fill="#5bc1f800"/>  
  <!-- <rect width="128" height="128" rx="28" fill="#b15eff"/> -->

  <!-- 背景装饰
  <circle cx="108" cy="22" r="6" fill="#ffffff" opacity="0.5"/>
  <circle cx="18" cy="104" r="5" fill="#ffffff" opacity="0.4"/>
  <path d="M10 18l3 6 6 3-6 3-3 6-3-6-6-3 6-3z" fill="#ffffff" opacity="0.55"/> -->

  <!-- 便签本（略微倾斜，带硬阴影） -->
  <g transform="translate(-18, -21) scale(1.3)">
    <g transform="rotate(-5 -30 76)">
      <rect x="30" y="50" width="72" height="60" rx="9" fill="#2C7DA0" opacity="0."/>
      <rect x="26" y="42" width="72" height="64" rx="9" fill="#ffffff"/>
      <path d="M26 51a9 9 0 0 1 9-9h54a9 9 0 0 1 9 9v9H26z" fill="#FF6B6B"/>
      <g fill="none" stroke="#ffffff" stroke-width="3.5">
        <circle cx="40" cy="51" r="4"/>
        <circle cx="54" cy="51" r="4"/>
        <circle cx="68" cy="51" r="4"/>
        <circle cx="82" cy="51" r="4"/>
      </g>
      
      <rect x="36" y="68" width="52" height="6" rx="3" fill="#A5D8FF"/>
      <rect x="36" y="80" width="44" height="6" rx="3" fill="#A5D8FF"/>
      <rect x="36" y="92" width="28" height="6" rx="3" fill="#A5D8FF"/>
    </g>
    

    <!-- 铅笔硬阴影 -->
    <g transform="translate(65 82) rotate(-42)">
      <rect x="0" y="-7" width="66" height="13" rx="7" fill="#2C7DA0" opacity="0.2"/>
    </g>

    <!-- 铅笔：笔尖朝左下压在便签本上 -->
    <g transform="translate(60 88) rotate(-50)">
      <path d="M0 0L13-7 13 7z" fill="#FFE3C2"/>
      <path d="M0 0L6-3.5 6 3.5z" fill="#4A5568"/>
      <rect x="13" y="-7" width="40" height="14" fill="#FFC93C"/>
      <rect x="17" y="-4" width="30" height="3" rx="1.5" fill="#ffffff" opacity="0.45"/>
      <rect x="53" y="-7" width="6" height="14" fill="#E9EEF3"/>
      <rect x="53" y="-7" width="2" height="14" fill="#C3CFDA"/>
      <path d="M59-7h4c3.3 0 6 3.1 6 7s-2.7 7-6 7h-4z" fill="#FF8FA3"/>
    </g>
  </g>
</svg>
