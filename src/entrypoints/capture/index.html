<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>截图摘记</title>
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <div id="app">
      <div class="bar">
        <span class="hint" id="hint"></span>
        <div class="bar-actions">
          <button id="btn-full" class="btn">全选</button>
          <button id="btn-save" class="btn primary">保存</button>
          <button id="btn-cancel" class="btn">取消</button>
        </div>
      </div>
      <div class="stage-wrap">
        <div class="stage" id="stage">
          <div class="img-holder" id="holder">
            <img id="cap-img" alt="" draggable="false" />
            <div class="sel" id="sel" hidden></div>
          </div>
        </div>
      </div>
      <div class="overlay" id="overlay" hidden>
        <div class="overlay-box">
          <p class="overlay-msg" id="overlay-msg"></p>
          <button id="btn-close" class="btn overlay-btn" hidden></button>
        </div>
      </div>
    </div>
  </body>
</html>
