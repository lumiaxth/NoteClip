<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NoteClip</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1b1d21;
        display: grid;
        place-items: center;
      }
      /* One visible image per page; fills the viewport without scrollbars. */
      #viewer {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .frame {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .frame[hidden] {
        display: none;
      }
      .frame-note {
        color: #9aa0a6;
        font: 14px/1.6 system-ui, sans-serif;
        background: #26282e;
        padding: 16px 22px;
        border-radius: 10px;
        margin: 0;
      }
      #viewer img {
        max-width: 100vw;
        max-height: 100vh;
        object-fit: contain;
        border-radius: 4px;
        user-select: none;
        -webkit-user-drag: none;
      }
      /* Whole-image click zones: left half → previous picture, right half →
         next one (multi-image clips only; right-click is untouched). */
      .frame img {
        cursor: pointer;
      }
      #pager {
        position: fixed;
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 10px;
        background: rgba(15, 18, 30, 0.7);
        color: #fff;
        font: 600 13px/1 system-ui, sans-serif;
        padding: 8px 12px;
        border-radius: 999px;
        user-select: none;
      }
      #pager[hidden] {
        display: none;
      }
      #pager button {
        border: 0;
        background: none;
        color: inherit;
        font: inherit;
        font-size: 16px;
        padding: 2px 10px;
        cursor: pointer;
      }
      #pager button[disabled] {
        opacity: 0.35;
        cursor: default;
      }
      /* Text "delete" action: small like the counter, red on hover as the
         destructive-action hint. */
      #pager #pager-delete {
        font-size: 12px;
        padding: 2px 8px;
        opacity: 0.8;
      }
      #pager #pager-delete:hover {
        color: #ef4444;
        opacity: 1;
      }
      p {
        color: #9aa0a6;
        font: 14px/1.6 system-ui, sans-serif;
      }
    </style>
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <div id="viewer" hidden></div>
    <div id="pager" hidden>
      <button id="pager-prev" title="‹">‹</button>
      <span id="pager-count"></span>
      <button id="pager-next" title="›">›</button>
      <button id="pager-delete"></button>
    </div>
    <p id="empty" hidden></p>
  </body>
</html>
